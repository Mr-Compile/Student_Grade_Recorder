<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>
  
  <!-- Document/Paper -->
  <rect x="136" y="80" width="240" height="320" rx="12" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Grade A+ -->
  <text x="256" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#4F46E5" text-anchor="middle">A+</text>
  
  <!-- Score line -->
  <line x1="166" y1="230" x2="346" y2="230" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Student icon -->
  <circle cx="200" cy="290" r="24" fill="#4F46E5"/>
  <path d="M176 340 Q200 360 224 340 L224 340" stroke="#4F46E5" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Checkmark for success -->
  <circle cx="312" cy="290" r="24" fill="#10B981"/>
  <path d="M300 290 L308 298 L324 282" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom decorative line -->
  <line x1="166" y1="360" x2="346" y2="360" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
